<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مصنّف أسئلة التربية الإسلامية</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: #f4efe6;
    margin: 0;
    padding: 20px;
    color: #2c2c2a;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 20px;
    background: #2c3e50;
    color: #fff;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .card {
    background: #fdf8ef;
    border: 1px solid #d9cdb0;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  label { display:block; font-weight: bold; margin-bottom: 6px; }
  select, textarea, input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #c9bd9e;
    font-size: 15px;
    font-family: inherit;
    margin-bottom: 12px;
  }
  textarea { min-height: 70px; resize: vertical; }
  button {
    background: #2c3e50;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
  }
  button:hover { background:#1c2833; }
  button.secondary { background:#8a6d3b; }
  .result {
    display:none;
    margin-top: 14px;
    padding: 14px;
    border-radius: 10px;
  }
  .level-badge {
    display:inline-block;
    padding: 4px 14px;
    border-radius: 20px;
    color:#fff;
    font-weight:bold;
    margin-bottom:8px;
  }
  .lvl-تذكر{background:#5DADE2}
  .lvl-فهم{background:#1E8449}
  .lvl-تطبيق{background:#B9770E}
  .lvl-تحليل{background:#884EA0}
  .lvl-التركيب-والإبداع{background:#C0392B}
  .lvl-تقويم{background:#7D6608}
  .lvl-غير-محدد{background:#7f8c8d}
  .filters { display:flex; gap:10px; margin-bottom: 14px; }
  .filters select { margin-bottom:0; }
  .qitem {
    border-bottom: 1px solid #e5dcc7;
    padding: 10px 0;
  }
  .qitem:last-child { border-bottom:none; }
  .qmeta { font-size:12px; color:#7a7264; margin-top:4px; }
  .stats { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
  .stat {
    background:#eee3cb;
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;
    min-width:90px;
    text-align:center;
  }
  .note { font-size:12px; color:#8a7d5f; margin-top:6px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>مصنّف مفردات أسئلة التربية الإسلامية (5-12)</h1>

  <div class="card">
    <label>1. اختر الصف</label>
    <select id="grade">
      <option value="">-- اختر الصف --</option>
      <option>الخامس</option><option>السادس</option><option>السابع</option>
      <option>الثامن</option><option>التاسع</option><option>العاشر</option>
      <option>الحادي عشر</option><option>الثاني عشر</option>
    </select>

    <label>2. أدخل السؤال</label>
    <textarea id="question" placeholder="مثال: استنتج الحكمة من مشروعية الصلاة"></textarea>

    <button onclick="classify()">صنّف السؤال</button>

    <div id="result" class="result">
      <span id="levelBadge" class="level-badge"></span>
      <p id="explain"></p>
      <p id="suggest" class="note"></p>
      <button class="secondary" onclick="saveQuestion()">موافق - أضف إلى بنك الأسئلة</button>
    </div>
  </div>

  <div class="card">
    <label>بنك الأسئلة - فلترة حسب المستوى</label>
    <div class="filters">
      <select id="filterLevel" onchange="renderBank()">
        <option value="all">كل المستويات</option>
        <option>تذكر</option><option>فهم</option><option>تطبيق</option>
        <option>تحليل</option><option>التركيب والإبداع</option><option>تقويم</option>
      </select>
      <select id="filterGrade" onchange="renderBank()">
        <option value="all">كل الصفوف</option>
        <option>الخامس</option><option>السادس</option><option>السابع</option>
        <option>الثامن</option><option>التاسع</option><option>العاشر</option>
        <option>الحادي عشر</option><option>الثاني عشر</option>
      </select>
    </div>
    <div class="stats" id="stats"></div>
    <div id="bankList" style="margin-top:14px;"></div>
    <p class="note">ملاحظة: بنك الأسئلة هذا مشترك بين كل من يستخدم هذه الصفحة (يظهر لجميع المعلمين).</p>
  </div>
</div>

<script>
const BLOOM = {
  "تذكر": ["اذكر","عدد","سم","عرف","حدد","اكتب","أكمل","اتل","اتلُ الآيات","اذكر الحديث","متى حدث","أين ورد","من القائل","ما المقصود بـ"],
  "فهم": ["فسر","فسّر","اشرح","وضح","وضّح","بين المعنى","بيّن المعنى","لخص","لخّص","أعد صياغة التعريف","أعط أمثلة","ما الفرق بين","قارن بين من حيث","ما علاقة","صنف","صنّف","رتب الأفكار","استنبط المعنى","وضح دلالة"],
  "تطبيق": ["طبق","طبّق","وظف","وظّف","كيف تتصرف","ماذا تفعل إذا","كيف تطبق","مثل بسلوك","مثّل بسلوك","عدل السلوك","عدّل السلوك","أرشد زميلك","استخدم ما تعلمته","بين التصرف المناسب","بيّن التصرف المناسب"],
  "تحليل": ["حلل","حلّل","استنتج السبب","استخلص النتائج","استخرج الدلالات","ميز بين","ميّز بين","صنف الأسباب","اربط بين السبب","حدد أوجه الشبه","بين العلاقة","بيّن العلاقة","علل الحكم","علّل الحكم","حلل الآثار","حدد المشكلة","استنتج القيمة","دلل على الفكرة","دلّل على الفكرة","قارن بين المواقف","استخرج جوانب الخطأ","قارن بين سلوكين","وازن بين موقفين"],
  "التركيب والإبداع": ["صمم","صمّم","أنشئ","صغ","صُغ","كون خطة","كوّن خطة","اقترح حلولا","اقترح حلولاً","اكتب رسالة توعوية","قدم نصيحة","قدّم نصيحة","أعد صياغة موقف","قدم مبادرة","قدّم مبادرة","ابتكر طريقة","اربط بين أكثر من مفهوم","صمم مطوية","صمّم مطوية","اقترح برنامجا","اقترح برنامجاً","وجه رسالة","وجّه رسالة"],
  "تقويم": ["قيم","قيّم","قوم","قوّم","احكم على","برر موقفك","برّر موقفك","ناقش مع التعليل","انقد","فند الرأي","فنّد الرأي","ما رأيك في","كيف ترد على","برهن على صحة","حدد الموقف الصحيح","بين رأيك","بيّن رأيك","صحح التصرف","صحّح التصرف"]
};

function norm(s){
  return (s||"").replace(/[\u064B-\u0652\u0670]/g,"").replace(/[إأآا]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim();
}

function classify(){
  const q = document.getElementById("question").value;
  const nq = norm(q);
  if(!q.trim()){ alert("الرجاء إدخال السؤال أولاً"); return; }
  let best = null, bestLen = 0;
  for(const level in BLOOM){
    for(const kw of BLOOM[level]){
      const nkw = norm(kw);
      if(nq.includes(nkw) && nkw.length > bestLen){
        best = level; bestLen = nkw.length;
      }
    }
  }
  const result = document.getElementById("result");
  const badge = document.getElementById("levelBadge");
  const explain = document.getElementById("explain");
  const suggest = document.getElementById("suggest");
  result.style.display = "block";
  if(best){
    badge.className = "level-badge lvl-" + best.replace(/ /g,"-");
    badge.textContent = "المستوى: " + best;
    explain.textContent = "تم تصنيف السؤال بناءً على الفعل/الكلمة المفتاحية المطابقة لمعايير مستوى (" + best + ") في وثيقة تقويم تعلم الطلبة.";
    suggest.textContent = "";
  } else {
    badge.className = "level-badge lvl-غير-محدد";
    badge.textContent = "لم يتم التعرف على مستوى واضح";
    explain.textContent = "لم يُعثر على فعل سلوكي واضح من قائمة أفعال بلوم داخل صياغة السؤال.";
    suggest.textContent = "اقتراح: أعد صياغة السؤال باستخدام فعل صريح مثل (اشرح - قارن - حلل - قيّم - صمم) حسب المستوى المطلوب.";
  }
  window._pendingClassification = {question:q, grade: document.getElementById("grade").value, level: best || "غير محدد"};
}

async function saveQuestion(){
  const item = window._pendingClassification;
  if(!item){ return; }
  if(!item.grade){ alert("الرجاء اختيار الصف قبل الحفظ"); return; }
  const key = "q_" + Date.now() + "_" + Math.random().toString(36).slice(2,7);
  try{
    await window.storage.set(key, JSON.stringify({...item, date: new Date().toLocaleDateString("ar")}), true);
    alert("تم حفظ السؤال في بنك الأسئلة");
    document.getElementById("question").value = "";
    document.getElementById("result").style.display = "none";
    renderBank();
  }catch(e){
    alert("حدث خطأ أثناء الحفظ. حاول مرة أخرى.");
  }
}

async function loadAll(){
  try{
    const list = await window.storage.list("q_", true);
    if(!list || !list.keys) return [];
    const items = [];
    for(const k of list.keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) items.push(JSON.parse(r.value));
      }catch(e){}
    }
    return items;
  }catch(e){ return []; }
}

async function renderBank(){
  const items = await loadAll();
  const fl = document.getElementById("filterLevel").value;
  const fg = document.getElementById("filterGrade").value;
  const filtered = items.filter(i =>
    (fl === "all" || i.level === fl) && (fg === "all" || i.grade === fg)
  );
  const listEl = document.getElementById("bankList");
  if(filtered.length === 0){
    listEl.innerHTML = "<p class='note'>لا توجد أسئلة مطابقة بعد.</p>";
  } else {
    listEl.innerHTML = filtered.reverse().map(i =>
      `<div class="qitem"><div>${i.question}</div><div class="qmeta">الصف: ${i.grade} — المستوى: ${i.level} — ${i.date||""}</div></div>`
    ).join("");
  }
  const counts = {};
  for(const lvl in BLOOM){ counts[lvl] = 0; }
  counts["غير محدد"] = 0;
  items.forEach(i => { counts[i.level] = (counts[i.level]||0) + 1; });
  document.getElementById("stats").innerHTML = Object.entries(counts).map(([lvl,c]) =>
    `<div class="stat"><b>${c}</b><br>${lvl}</div>`
  ).join("");
}

renderBank();
</script>
</body>
</html>
